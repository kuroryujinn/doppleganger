[package]
name = "dg-r5-fixture"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "dg_r5_fixture"
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []
idl-build = ["anchor-lang/idl-build"]
cpi = []
anchor-debug = []
no-log-ix-name = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
