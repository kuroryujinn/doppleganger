name: Production MVP acceptance

# Opt in on a runner provisioned with the project's pinned Solana toolchain.
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  acceptance:
    # Fork code must not execute on the project's self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, doppelganger]
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "4"
      DG_RUN_DEVNET_TESTS: "0"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build pinned local acceptance programs
        run: bash scripts/build-production-fixtures.sh
      - name: Verify policy and migration workflow
        run: bash scripts/check-production-mvp.sh
      - name: Retain migration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: migration-evidence
          path: |
            report/production-mvp.*/
            report/mvp-qualification/*.json
          if-no-files-found: warn
