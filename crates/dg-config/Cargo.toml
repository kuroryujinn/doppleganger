[package]
name = "dg-config"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
dg-analysis = { path = "../dg-analysis" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
num-bigint = "0.4.8"
solana-address = { version = "=2.6.1", features = ["curve25519"] }
solana-keypair = "=3.1.2"
solana-signer = "=3.0.1"
solana-instruction = "=3.4.1"
