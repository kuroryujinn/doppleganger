[package]
name = "dg-snapshot"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
dg-analysis = { path = "../dg-analysis" }
dg-config = { path = "../dg-config" }
dg-state = { path = "../dg-state" }
dg-runtime = { path = "../dg-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
toml = "0.9"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
solana-account = "=4.3.2"
solana-address = "=2.6.1"
solana-signer = "=3.0.1"

[dev-dependencies]
dg-regression = { path = "../dg-regression" }
solana-keypair = "=3.1.2"
