[package]
name = "dg-cli"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "doppelganger"
path = "src/main.rs"

[dependencies]
dg-analysis = { path = "../dg-analysis" }
dg-config = { path = "../dg-config" }
dg-runtime = { path = "../dg-runtime" }
dg-regression = { path = "../dg-regression" }
dg-snapshot = { path = "../dg-snapshot" }
dg-policy = { path = "../dg-policy" }
sha2 = "0.10.9"
anchor-lang.workspace = true
dg-vault-v1 = { path = "../../programs/dg-vault-v1", features = ["no-entrypoint"] }
dg-vault-v2 = { path = "../../programs/dg-vault-v2", features = ["no-entrypoint"] }
litesvm = "=0.16.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
solana-address = "=2.6.1"
solana-instruction = "=3.4.1"
solana-keypair = "=3.1.2"
solana-message = "=4.4.1"
solana-rent = "=4.3.0"
solana-signer = "=3.0.1"
solana-transaction = "=4.1.6"

[dev-dependencies]
dg-state = { path = "../dg-state" }
