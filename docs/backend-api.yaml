{
  "openapi": "3.1.0",
  "info": {
    "title": "Doppelganger backend",
    "version": "0.1.0",
    "description": "B2 prepared-project API implemented by dg-api. Live rootless-container acceptance remains pending; source mode is disabled until B3. A migration FAIL is a completed result; worker failures never publish PASS."
  },
