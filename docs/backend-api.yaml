    "/health/live": {
      "get": {
        "operationId": "liveness",
        "description": "Process liveness. A live API may accept uploads while the execution worker is unavailable.",
        "responses": {
          "200": {
            "description": "Successful request",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Health"
                }
              }
            }
          }
        },
        "security": []
      }
    },
    "/health/ready": {
      "get": {
        "operationId": "readiness",
        "description": "Readiness requires verified isolation, storage limits and fresh worker health; never indicates readiness based solely on database connectivity.",
        "responses": {
          "200": {
            "description": "Successful request",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Health"
                }
              }
            }
          },
          "503": {
            "description": "Required worker isolation/storage unavailable",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Health"
                }
              }
            }
          }
        },
        "security": []
